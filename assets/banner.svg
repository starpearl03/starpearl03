<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Felistas Charuka, Software Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1f3864"/></linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7aa2f7" stop-opacity=".35"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .g{fill:#7aa2f7;font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;opacity:.08;animation:tw ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.06}50%{opacity:.5}}
  .p{fill:#f6c177;animation:orbit 9s linear infinite}
  @keyframes orbit{
    0%{transform:translateX(0);opacity:.15;animation-timing-function:ease-out}
    25%{transform:translateX(var(--rx));opacity:.55;animation-timing-function:ease-in}
    50%{transform:translateX(0);opacity:1;animation-timing-function:ease-out}
    75%{transform:translateX(calc(var(--rx) * -1));opacity:.55;animation-timing-function:ease-in}
    100%{transform:translateX(0);opacity:.15;animation-timing-function:ease-out}}
  .halo{animation:breathe 6s ease-in-out infinite;transform-origin:1010px 160px}
  @keyframes breathe{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}
  .in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .name{font-family:Georgia, 'Times New Roman', serif;font-size:64px;fill:#f2f4f8}
  .role{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;font-size:22px;fill:#f6c177;letter-spacing:.5px}
  .meta{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;font-size:15px;fill:#a9b4c8}
  .rule{stroke:#7aa2f7;stroke-width:2;stroke-dasharray:260;animation:draw 1.4s .5s ease both}
  @keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion: reduce){*{animation-play-state:paused!important}.in,.rule{animation:none!important}}
</style>
